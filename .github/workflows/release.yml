name: Diffusion

on:
  workflow_dispatch:
  push:
    branches: ['ios-release']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Resolve latest stable-diffusion.cpp release
        id: release
        run: |
          # This fork publishes only the iOS packages for Koharu's pinned release.
          printf 'tag=%s\n' 'master-964-1d0a58a' >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' 'master-964-1d0a58a.1' >> "$GITHUB_OUTPUT"

  build:
    needs: source
    name: ${{ matrix.backend }} / ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - backend: metal
            os: macos-latest
            target: aarch64-apple-ios

    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      # mozilla/sccache#2809 merge snapshot also includes #2722 and #2811.
      SCCACHE_REV: a91b5c1c5566c1d5abd9a2a662cf37fde07236cb
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      TARGET_TRIPLE: ${{ matrix.target }}
      IOS_DEPLOYMENT_TARGET: '18.0'

    steps:
      - uses: actions/checkout@v7

      - name: Cache sccache
        id: sccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.SCCACHE_REV }}-gha

      - name: Build sccache
        if: steps.sccache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --locked \
            --git https://github.com/mozilla/sccache \
            --rev "$SCCACHE_REV" \
            --no-default-features --features gha \
            --root "$RUNNER_TEMP/sccache" sccache

      - name: Configure sccache
        uses: actions/github-script@v9
        with:
          script: |
            core.addPath(`${process.env.RUNNER_TEMP}/sccache/bin`);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', 'on');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check out stable-diffusion.cpp
        uses: actions/checkout@v7
        with:
          repository: leejet/stable-diffusion.cpp
          ref: ${{ needs.source.outputs.tag }}
          path: upstream/stable-diffusion.cpp
          submodules: true

      - name: Install CUDA 13.3
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@master
        with:
          cuda: '13.3.1'
          method: network
          log-file-suffix: ${{ matrix.target }}
          sub-packages: >-
            ${{ runner.os == 'Linux'
              && '["nvcc", "cudart", "crt", "thrust"]'
              || '["nvcc", "cudart", "crt", "thrust", "nvvm", "cublas", "cublas_dev"]' }}
          non-cuda-sub-packages: >-
            ${{ runner.os == 'Linux' && '["libcublas", "libcublas-dev"]' || '[]' }}

      - name: Set up Python for ROCm
        if: matrix.backend == 'hip'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ROCm 10.0
        if: matrix.backend == 'hip'
        shell: bash
        run: |
          python -m pip install \
            --index-url https://stable.repo.amd.com/rocm/whl-next/ \
            "rocm[libraries,devel]==10.0.0"
          rocm-sdk init

          rocm_root=$(rocm-sdk path --root)
          if [[ "$RUNNER_OS" == Windows ]]; then
            rocm_root=$(cygpath -w "$rocm_root")
            rocm_bin="$rocm_root\\bin"
            llvm_root="$rocm_root\\lib\\llvm"
            llvm_bin="$llvm_root\\bin"
            device_lib="$llvm_root\\amdgcn\\bitcode"
          else
            rocm_bin="$rocm_root/bin"
            llvm_root="$rocm_root/lib/llvm"
            llvm_bin="$llvm_root/bin"
            device_lib="$llvm_root/amdgcn/bitcode"
          fi
          {
            printf 'ROCM_PATH=%s\n' "$rocm_root"
            printf 'HIP_PATH=%s\n' "$rocm_root"
            printf 'HIP_PLATFORM=amd\n'
            printf 'HIP_DEVICE_LIB_PATH=%s\n' "$device_lib"
            printf 'LLVM_PATH=%s\n' "$llvm_root"
          } >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$rocm_bin" "$llvm_bin" >> "$GITHUB_PATH"

      - name: Enable Visual Studio 2022 toolset
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux' && matrix.backend != 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Install Vulkan build dependencies on Linux
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            glslc \
            libvulkan-dev \
            ninja-build \
            spirv-headers

      - name: Install Vulkan SDK on Windows
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: bash
        run: |
          version=1.4.328.1
          installer="$(cygpath -u "$RUNNER_TEMP")/VulkanSDK-Installer.exe"
          curl.exe -o "$installer" -L \
            "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          "$installer" --accept-licenses --default-answer --confirm-command install
          printf 'VULKAN_SDK=C:\\VulkanSDK\\%s\n' "$version" >> "$GITHUB_ENV"
          printf 'C:\\VulkanSDK\\%s\\bin\n' "$version" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          generator=()
          backend_args=()
          platform_args=()

          if [[ "$RUNNER_OS" == Windows || "$RUNNER_OS" == Linux ]]; then
            generator=(-G Ninja)
          fi

          if [[ "$RUNNER_OS" == Windows && "$BACKEND" != hip ]]; then
            platform_args+=(
              "-DCMAKE_C_COMPILER=cl.exe"
              "-DCMAKE_CXX_COMPILER=cl.exe"
              "-DCMAKE_CXX_FLAGS=-bigobj"
            )
          fi

          case "$BACKEND" in
            cuda)
              backend_args+=(
                "-DSD_CUDA=ON"
                "-DCMAKE_CUDA_ARCHITECTURES=75-virtual;80-virtual;86-real;89-real;90-virtual;120a-real;121a-real"
              )
              ;;
            hip)
              suffix=
              if [[ "$RUNNER_OS" == Windows ]]; then
                suffix=.exe
              fi
              backend_args+=(
                "-DSD_HIPBLAS=ON"
                "-DCMAKE_C_COMPILER=clang$suffix"
                "-DCMAKE_CXX_COMPILER=clang++$suffix"
              )
              if [[ "$RUNNER_OS" == Linux ]]; then
                backend_args+=("-DGPU_TARGETS=gfx908;gfx90a;gfx942;gfx950;gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1150;gfx1151;gfx1152;gfx1200;gfx1201")
              else
                backend_args+=("-DGPU_TARGETS=gfx1010;gfx1011;gfx1012;gfx1030;gfx1031;gfx1032;gfx1033;gfx1034;gfx1035;gfx1036;gfx1100;gfx1101;gfx1102;gfx1103;gfx1150;gfx1151;gfx1152;gfx1153;gfx1200;gfx1201")
              fi
              ;;
            vulkan)
              backend_args+=("-DSD_VULKAN=ON")
              ;;
            metal)
              backend_args+=(
                "-DSD_METAL=ON"
                "-DCMAKE_OSX_ARCHITECTURES=arm64"
              )
              if [[ "$TARGET_TRIPLE" == *-apple-ios ]]; then
                backend_args+=(
                  "-DCMAKE_SYSTEM_NAME=iOS"
                  "-DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOYMENT_TARGET"
                )
              fi
              ;;
          esac

          cmake -S upstream/stable-diffusion.cpp -B build "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=sccache \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DGGML_BACKEND_DL=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_REPACK=OFF \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_HIP_RCCL=OFF \
            -DGGML_METAL_NDEBUG=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            "${platform_args[@]}" \
            "${backend_args[@]}"

      - name: Build stable-diffusion
        shell: bash
        timeout-minutes: 300
        run: cmake --build build --target stable-diffusion --config Release

      - name: Package stable-diffusion
        if: matrix.target != 'aarch64-apple-ios'
        shell: bash
        run: |
          mkdir package
          cp build/bin/*stable-diffusion.* package/
          tar -C package -czf "$TARGET_TRIPLE-$BACKEND.tar.gz" .

      # iOS loads code only from frameworks signed into the app bundle, so Koharu embeds
      # this XCFramework and opens Frameworks/stable-diffusion.framework/stable-diffusion.
      - name: Package stable-diffusion framework
        if: matrix.target == 'aarch64-apple-ios'
        shell: bash
        run: |
          mkdir package
          name=stable-diffusion
          framework="frameworks/$name.framework"
          mkdir -p "$framework"
          cp "build/bin/lib$name.dylib" "$framework/$name"
          install_name_tool -id "@rpath/$name.framework/$name" "$framework/$name"
          cat > "$framework/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>$name</string>
            <key>CFBundleIdentifier</key><string>rs.koharu.$name</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>$name</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>$IOS_DEPLOYMENT_TARGET</string>
          </dict>
          </plist>
          PLIST
          otool -L "$framework/$name"
          xcodebuild -create-xcframework -framework "$framework" -output "package/$name.xcframework"
          tar -C package -czf "$TARGET_TRIPLE-$BACKEND.tar.gz" .

      - name: Stop sccache
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Upload stable-diffusion
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-${{ matrix.backend }}
          path: ${{ matrix.target }}-${{ matrix.backend }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download stable-diffusion builds
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release
          merge-multiple: true

      - name: Publish stable-diffusion release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.source.outputs.release_tag }}
          target_commitish: ${{ github.event.repository.default_branch }}
          name: Diffusion ${{ needs.source.outputs.release_tag }}
          body: Koharu runtime dependency.
          fail_on_unmatched_files: true
          files: release/*.tar.gz
